version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  # End-to-end tests (Phase 14); Playwright, its core and axe move together.
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright-core", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: ["/infra/docker", "/apps/web"]
    schedule: { interval: monthly }
