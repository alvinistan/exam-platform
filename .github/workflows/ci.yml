# Continuous integration: every push to main and every pull request.
# Third-party actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests plus Testcontainers integration tests (real PostgreSQL 16 per service).
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee "$RUNNER_TEMP/maven.log"
      - name: Show failures on the pull request
        if: failure()
        working-directory: .
        run: python3 .github/scripts/annotate_failures.py "$RUNNER_TEMP/maven.log" backend
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  web:
    name: Web lint, typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    name: OpenAPI contract lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/openapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npx --yes @redocly/cli@2.62.1 lint

  database:
    name: Migrations and schema rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: backend/db-tests/run.sh

  security-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails on known CRITICAL vulnerabilities with a fix available, and on any committed secret.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # Full HIGH+CRITICAL listing for review (does not fail the build).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'

  images:
    name: Image ${{ matrix.image }}
    needs: [backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gateway, dockerfile: infra/docker/service.Dockerfile, module: gateway }
          - { image: identity-service, dockerfile: infra/docker/service.Dockerfile, module: services/identity-service }
          - { image: catalog-service, dockerfile: infra/docker/service.Dockerfile, module: services/catalog-service }
          - { image: assessment-service, dockerfile: infra/docker/service.Dockerfile, module: services/assessment-service }
          - { image: learning-service, dockerfile: infra/docker/service.Dockerfile, module: services/learning-service }
          - { image: subscription-service, dockerfile: infra/docker/service.Dockerfile, module: services/subscription-service }
          - { image: web, dockerfile: apps/web/Dockerfile, module: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: MODULE=${{ matrix.module }}
          tags: leenex/${{ matrix.image }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Image publishing to Amazon ECR is added with the deployment phase, after AWS access is approved.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: leenex/${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Check the container runs as a non-root user
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' leenex/${{ matrix.image }}:ci)
          echo "Configured user: $user"
          case "$user" in ""|root|0|0:*) echo "Image runs as root"; exit 1;; esac
