openapi: 3.1.0
info:
  title: identity-service
  version: 0.1.0
  description: Google sign-in, platform tokens, profiles, roles and account status. Routed by the gateway under /api/auth, /api/users and /api/admin/users.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin, through the API gateway (local default http://localhost:8080)
tags:
  - name: Auth
    description: Sign-in and token lifecycle
  - name: Users
    description: The signed-in user's profile
  - name: Admin users
    description: Role and account management (Administrator only)
  - name: Keys
    description: Public keys other services use to verify tokens
security:
  - bearerAuth: []
paths:
  /api/auth/google/start:
    get:
      tags: [Auth]
      operationId: startGoogleSignIn
      summary: Start Google sign-in
      description: >-
        Redirects to Google with state, nonce and PKCE (S256). The verifier and nonce stay on the server; the state
        is also set in a 10-minute __Host-oauth cookie (Secure, HttpOnly, SameSite=Lax) that binds the sign-in to
        this browser. If sign-in is not configured, redirects to /signin?error=not_configured.
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Path on this site to return to after sign-in. Anything else (other sites, "//host") returns to "/".
          schema: { type: string, maxLength: 200 }
      responses:
        '302':
          description: Redirect to Google's authorization endpoint.
          headers:
            Set-Cookie:
              description: "__Host-oauth=<state>; Path=/; Max-Age=600; Secure; HttpOnly; SameSite=Lax"
              schema: { type: string }
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
  /api/auth/google/callback:
    get:
      tags: [Auth]
      operationId: completeGoogleSignIn
      summary: Complete Google sign-in
      description: >-
        Checks that state matches the __Host-oauth cookie, exchanges the code (with the PKCE verifier), verifies the
        ID token (signature, issuer, audience, expiry, nonce, email_verified), creates the account on first sign-in
        (role STUDENT; ADMIN too for the one-time bootstrap email), sets the refresh-token cookie and redirects to
        the page the user came from. Every failure redirects to /signin?error=<code>, where code is one of
        cancelled, google_error, google_unavailable, invalid_state, expired, invalid_token, email_unverified,
        suspended, account_conflict.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, description: Set by Google when the user cancels., schema: { type: string } }
      responses:
        '302':
          description: Redirect to the web app (signed in), or to its sign-in page with an error code.
          headers:
            Set-Cookie:
              description: "__Host-rt=<refresh token>; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Strict"
              schema: { type: string }
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
  /api/auth/token:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Get a new access token
      description: >-
        Rotates the refresh token (web: HttpOnly cookie; mobile: request body) and returns a 15-minute access token.
        Reusing an already-rotated refresh token revokes the whole session family; within 30 seconds of a rotation
        (two tabs at once) an access token is issued without rotating again. Cookie requests must send
        X-Requested-With: fetch (CSRF defence). On failure the web cookie is cleared.
      security: []
      parameters:
        - name: X-Requested-With
          in: header
          required: false
          schema: { type: string, enum: [fetch] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Mobile clients only. }
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          description: Missing X-Requested-With header (FORBIDDEN), or the account is suspended (ACCOUNT_SUSPENDED).
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: >-
        Revokes the presented refresh token's whole session family and clears the cookie. Works without an access
        token, so an expired session can still sign out. Cookie requests must send X-Requested-With: fetch.
      security: []
      parameters:
        - name: X-Requested-With
          in: header
          required: false
          schema: { type: string, enum: [fetch] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Mobile clients only. }
      responses:
        '204':
          description: Signed out (also when there was no session).
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
  /api/users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Get my profile
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      operationId: updateMe
      summary: Update my profile
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The ETag (profile version) from the last GET. A stale value returns 409.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1, maxLength: 120 }
                preferences: { type: object }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
    delete:
      tags: [Users]
      operationId: deleteMe
      summary: Delete my account
      description: >-
        Anonymises personal data (name, email, photo, preferences), removes roles and revokes every session;
        aggregate statistics are kept (FR-ID-09). The only active administrator can't delete their account.
      responses:
        '202':
          description: Account deleted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
  /api/admin/users:
    get:
      tags: [Admin users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
        - { name: q, in: query, description: Name or email contains, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, schema: { type: string, enum: [STUDENT, ADMIN] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
                  page: { $ref: './common.yaml#/components/schemas/PageMeta' }
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
  /api/admin/users/names:
    get:
      tags: [Admin users]
      operationId: userNames
      summary: Display names and emails for up to 100 user IDs
      description: Lets admin screens of other services show who created or changed a record (FR-QB-12), and finance screens show who paid. Deleted users show as "Deleted user".
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Names of the users that exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, displayName, email]
                  properties:
                    id: { type: string, format: uuid }
                    displayName: { type: string }
                    email: { type: string }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api/admin/users/{userId}/roles/{role}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: role, in: path, required: true, schema: { type: string, enum: [ADMIN] } }
    put:
      tags: [Admin users]
      operationId: grantRole
      summary: Grant the admin role
      responses:
        '204': { description: Granted (audited). }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    delete:
      tags: [Admin users]
      operationId: revokeRole
      summary: Revoke the admin role
      description: An administrator cannot revoke their own admin role, and the last active administrator cannot be demoted.
      responses:
        '204': { description: Revoked (audited). }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /api/admin/users/{userId}/status:
    put:
      tags: [Admin users]
      operationId: setUserStatus
      summary: Suspend or reactivate an account
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
                reason: { type: string, minLength: 3, maxLength: 500 }
      description: Administrators can't change their own status; the last active administrator can't be suspended.
      responses:
        '204': { description: Updated (audited); every session ends at once on suspension. }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /.well-known/jwks.json:
    get:
      tags: [Keys]
      operationId: getJwks
      summary: Token verification keys
      description: Public keys (ES256) used by every service to verify access tokens. Keys rotate; old keys stay listed until their tokens expire.
      security: []
      responses:
        '200':
          description: JSON Web Key Set.
          content:
            application/json:
              schema: { type: object, required: [keys], properties: { keys: { type: array, items: { type: object } } } }
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
  /oauth2/token:
    post:
      tags: [Keys]
      operationId: issueServiceToken
      summary: Service token (OAuth 2.0 client-credentials grant, ADR-005)
      description: >-
        For backend services only; the gateway never routes this path. Clients authenticate with HTTP Basic or
        client_id/client_secret form fields. Tokens carry role SERVICE and the granted scopes, last a few minutes, and
        can reach /internal/** but never act for a user. Errors follow RFC 6749 (`error`: invalid_client,
        unsupported_grant_type, invalid_scope).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                scope: { type: string, description: Space-separated; must be a subset of the client's scopes. }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  scope: { type: string }
        '400':
          description: Unsupported grant or scope.
          content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }
        '401':
          description: Unknown client or wrong secret.
          content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenResponse:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string, description: 'ES256 JWT; claims: iss, aud, sub, roles, status, iat, exp, jti' }
        expiresIn: { type: integer, examples: [900] }
        tokenType: { type: string, const: Bearer }
        refreshToken: { type: [string, 'null'], description: Returned to mobile clients only. }
    User:
      type: object
      required: [id, email, displayName, roles, status, version]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        photoUrl: { type: [string, 'null'], format: uri }
        roles:
          type: array
          items: { type: string, enum: [STUDENT, ADMIN] }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        preferences: { type: object }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, description: Also sent as the ETag. }
