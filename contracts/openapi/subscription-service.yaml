openapi: 3.1.0
info:
  title: subscription-service
  version: 0.1.0
  description: >-
    Free-access policies, access decisions, plans, checkout, verified payment webhooks, subscriptions and entitlements.
    Routed under /api/access, /api/plans, /api/subscriptions, /api/payments and /api/admin/billing.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin, through the API gateway (local default http://localhost:8080)
tags:
  - name: Access
    description: Free or premium status for the caller
  - name: Plans
    description: Subscription plans and checkout
  - name: Payments
    description: Payment-provider callbacks
  - name: Admin billing
    description: Policies, plans, payments and entitlements (Administrator only)
  - name: Internal
    description: Service-to-service only
security:
  - bearerAuth: []
paths:
  /api/access/exams:
    get:
      tags: [Access]
      operationId: getExamAccess
      summary: Access status for a list of exams
      description: Anonymous callers get the policy view (Free or Locked); signed-in callers also see subscriptions and allowances.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: examIds
          in: query
          required: true
          style: form
          explode: false
          schema: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Map of examId to access status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: './common.yaml#/components/schemas/AccessStatus' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
  /api/access/me:
    get:
      tags: [Access]
      operationId: getMyAccess
      summary: The caller's plan
      responses:
        '200':
          description: Premium status, welcome attempts left and how many exams are free.
          content:
            application/json:
              schema:
                type: object
                required: [premium, freeExamCount]
                properties:
                  premium: { type: boolean }
                  entitlement:
                    type: [object, 'null']
                    properties:
                      source: { type: string, enum: [SUBSCRIPTION, MANUAL] }
                      endsAt: { type: string, format: date-time }
                  welcomeAttemptsLeft: { type: [integer, 'null'], description: Null when the welcome allowance is off. }
                  freeExamCount: { type: integer }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /api/plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: Active plans
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Active plans in display order.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
  /api/subscriptions/me:
    get:
      tags: [Plans]
      operationId: getMySubscription
      summary: My subscription status and history
      responses:
        '200':
          description: Current status (computed at request time) and history.
          content:
            application/json:
              schema:
                type: object
                required: [status, history]
                properties:
                  status: { type: string, enum: [FREE, ACTIVE, EXPIRED, PAYMENT_PENDING] }
                  activeUntil: { type: [string, 'null'], format: date-time }
                  renewalReminder: { type: boolean, description: True within 7 days of expiry (SB-4). }
                  history: { type: array, items: { $ref: '#/components/schemas/SubscriptionPeriod' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /api/subscriptions/checkout:
    post:
      tags: [Plans]
      operationId: startCheckout
      summary: Start checkout for a plan
      description: Creates a PENDING transaction (price copied from the plan) and returns the provider's hosted checkout URL. Nothing is activated here.
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, format: uuid }
      responses:
        '201':
          description: Checkout created.
          content:
            application/json:
              schema:
                type: object
                required: [transactionId, checkoutUrl, sandbox]
                properties:
                  transactionId: { type: string, format: uuid }
                  checkoutUrl: { type: string, format: uri }
                  sandbox: { type: boolean }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /api/subscriptions/checkout/{transactionId}:
    get:
      tags: [Plans]
      operationId: getCheckoutStatus
      summary: Poll a checkout's status (return page)
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Status only; the return page never activates anything.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, CANCELLED] }
                  activeUntil: { type: [string, 'null'], format: date-time }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /api/payments/webhooks/{provider}:
    post:
      tags: [Payments]
      operationId: receiveWebhook
      summary: Payment-provider webhook
      description: >-
        Signature verified against the raw body with the provider's secret and timestamp tolerance (5 min) before parsing.
        Recorded once per provider event id (SB-9); success activates the subscription and entitlement in one transaction.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [sandbox, stripe, payhere] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Accepted (including duplicates). }
        '400': { description: Invalid signature or payload; nothing recorded. }
  /api/admin/billing/policies:
    get:
      tags: [Admin billing]
      operationId: getPolicies
      summary: Free-access policies with a live preview
      responses:
        '200':
          description: Policies and the resulting free exam list.
          content:
            application/json:
              schema:
                type: object
                required: [policies, freeExamIds, exams]
                properties:
                  policies: { type: array, items: { $ref: '#/components/schemas/Policy' } }
                  freeExamIds: { type: array, items: { type: string, format: uuid } }
                  exams:
                    type: array
                    description: Published exams in catalogue order and what the policies make of each.
                    items: { $ref: '#/components/schemas/ExamAccess' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api/admin/billing/policies/{ruleCode}:
    put:
      tags: [Admin billing]
      operationId: updatePolicy
      summary: Change a free-access policy (audited)
      parameters:
        - { name: ruleCode, in: path, required: true, schema: { type: string, enum: [FA1_CATALOGUE_POSITION, FA2_WELCOME_ALLOWANCE, FA4_FREE_FEATURES] } }
        - { name: If-Match, in: header, required: true, description: Version for optimistic locking., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policy' }
      responses:
        '200': { description: Saved; applies from the next attempt (FA-6)., content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } } }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /api/admin/billing/plans:
    post:
      tags: [Admin billing]
      operationId: createPlan
      summary: Create a plan (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api/admin/billing/entitlements:
    get:
      tags: [Admin billing]
      operationId: listEntitlements
      summary: Entitlements, newest first (up to 200)
      parameters:
        - { name: studentId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Entitlements., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Entitlement' } } } } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [Admin billing]
      operationId: grantEntitlement
      summary: Grant a manual entitlement (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, endsAt, reason]
              properties:
                studentId: { type: string, format: uuid }
                endsAt: { type: string, format: date-time }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Granted from now until endsAt (at most 5 years)., content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api/admin/billing/entitlements/{entitlementId}/revoke:
    post:
      tags: [Admin billing]
      operationId: revokeEntitlement
      summary: Revoke an entitlement, e.g. after a manual refund (audited)
      parameters:
        - { name: entitlementId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '204': { description: Revoked; takes effect on the next request. }
        '409': { description: Already revoked (CONFLICT)., content: { application/problem+json: { schema: { $ref: './common.yaml#/components/schemas/Problem' } } } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /internal/access-decisions:
    post:
      tags: [Internal]
      operationId: decideAccess
      summary: Decide whether a student may start a mode on an exam (assessment-service)
      description: >-
        Needs a service token with scope billing.access. Evaluated at request time with no caching beyond the request
        (FR-ACC-03). With `consume` (and `attemptId`), an allowed start is recorded: a free exam stays free for the
        student afterwards (FA-5) and a welcome attempt is counted once per attemptId; starts by one student are
        serialised.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, examId, mode]
              properties:
                studentId: { type: string, format: uuid }
                examId: { type: string, format: uuid }
                mode: { $ref: './common.yaml#/components/schemas/Mode' }
                consume: { type: boolean, default: false }
                attemptId: { type: string, format: uuid }
      responses:
        '200':
          description: Decision.
          content:
            application/json:
              schema:
                type: object
                required: [allowed, bank, reason]
                properties:
                  allowed: { type: boolean }
                  bank: { type: string, enum: [TRIAL, MAIN] }
                  reason:
                    type: string
                    description: >-
                      FA1_POSITION_n_OF_N, FA1_CATEGORY_POSITION_n_OF_N, FA5_KEPT_FREE, ACTIVE_ENTITLEMENT,
                      WELCOME_ALLOWANCE, MODE_NOT_FREE, SUBSCRIPTION_REQUIRED or EXAM_UNAVAILABLE.
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Plan:
      type: object
      required: [id, code, name, durationMonths, priceMinor, currency, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        durationMonths: { type: integer, enum: [1, 3, 6, 12] }
        priceMinor: { type: integer, description: Price in the currency's smallest unit. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        active: { type: boolean }
        displayOrder: { type: integer }
    PlanInput:
      type: object
      required: [code, name, durationMonths, priceMinor, currency]
      properties:
        code: { type: string, pattern: '^[a-z0-9-]{2,30}$' }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        durationMonths: { type: integer, enum: [1, 3, 6, 12] }
        priceMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        active: { type: boolean }
        displayOrder: { type: integer }
    SubscriptionPeriod:
      type: object
      required: [id, planName, status, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        planName: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, CANCELLED] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    ExamAccess:
      type: object
      required: [examId, title, slug, categoryId, access, reason]
      properties:
        examId: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        categoryId: { type: string, format: uuid }
        displayOrder: { type: [integer, 'null'] }
        access: { type: string, enum: [FREE, PREMIUM] }
        reason: { type: string, examples: [FA1_POSITION_2_OF_6, SUBSCRIPTION_REQUIRED] }
    Entitlement:
      type: object
      required: [id, studentId, source, state, startsAt, endsAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        source: { type: string, enum: [SUBSCRIPTION, MANUAL] }
        state: { type: string, enum: [ACTIVE, SCHEDULED, EXPIRED, REVOKED] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        grantReason: { type: [string, 'null'] }
        grantedBy: { type: [string, 'null'], format: uuid }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Policy:
      type: object
      required: [ruleCode, active, params]
      properties:
        ruleCode: { type: string, enum: [FA1_CATALOGUE_POSITION, FA2_WELCOME_ALLOWANCE, FA4_FREE_FEATURES] }
        active: { type: boolean }
        params: { type: object }
        version: { type: integer }
