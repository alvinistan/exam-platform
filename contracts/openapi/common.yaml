openapi: 3.1.0
info:
  title: Leenex Labs Exam Platform — shared components
  version: 0.1.0
  description: Components shared by every service contract. Not served on its own.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token issued by identity-service (15 minutes), sent as `Authorization: Bearer <token>`."
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size.
      schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Repeating a request with the same key returns the original result instead of acting twice.
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional; generated by the gateway when absent and echoed in every response and log line.
      schema: { type: string, maxLength: 64 }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is a stable, non-sensitive reason code clients can switch on.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ['https://leenexlabs.example/problems/subscription-required'] }
        title: { type: string, examples: ['Subscription required'] }
        status: { type: integer, examples: [403] }
        code:
          type: string
          examples: [SUBSCRIPTION_REQUIRED]
          description: >-
            Known codes: VALIDATION_FAILED, NOT_FOUND, CONFLICT, UNAUTHENTICATED, FORBIDDEN, ACCOUNT_SUSPENDED,
            SUBSCRIPTION_REQUIRED, SUBSCRIPTION_EXPIRED, PAYMENT_PENDING, FREE_ALLOWANCE_USED, MODE_DISABLED,
            ATTEMPT_EXPIRED, ATTEMPT_FINISHED, INSUFFICIENT_QUESTIONS, EXAM_UNAVAILABLE, SLUG_TAKEN, PUBLISH_BLOCKED,
            RATE_LIMITED, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR.
        detail: { type: string }
        correlationId: { type: string }
        blockers:
          type: array
          description: With PUBLISH_BLOCKED, every reason the exam can't be (or stay) published.
          items: { type: string }
        issues:
          type: array
          description: With PUBLISH_BLOCKED, the same reasons, each tagged with the setup step that fixes it.
          items: { $ref: '#/components/schemas/SetupIssue' }
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    Mode:
      type: string
      enum: [PRACTICE, MOCK, USER_FRIENDLY]
    Difficulty:
      type: string
      enum: [SIMPLE, MEDIUM, HARD]
    MasteryState:
      type: string
      enum: [STRONG, DEVELOPING, REVIEW, INSUFFICIENT]
    AccessStatus:
      type: object
      description: >-
        The caller's access to an exam, decided by subscription-service. Each switched-on exam type has its own free
        attempts; once they are used, that type is locked until the student has Premium.
      required: [available, premium, modes]
      properties:
        available: { type: boolean, description: 'False when the exam is unknown, a draft or archived.' }
        premium: { type: boolean, description: The caller has an active entitlement. }
        modes:
          type: array
          items:
            type: object
            required: [mode, access, freeAttempts]
            properties:
              mode: { $ref: '#/components/schemas/Mode' }
              access: { type: string, enum: [OPEN, FREE, LOCKED], description: 'OPEN: Premium. FREE: free attempts left.' }
              freeAttempts: { type: integer, minimum: 0 }
              used: { type: [integer, 'null'], description: Null for anonymous visitors and Premium students. }
              left: { type: [integer, 'null'] }
    SetupIssue:
      type: object
      required: [step, message]
      properties:
        step: { type: string, enum: [DETAILS, STRUCTURE, QUESTIONS, MODES] }
        message: { type: string, examples: ['Mock exam needs at least 20 ready questions; 12 ready.'] }
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not allowed (role, subscription, ownership hidden as 404).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not visible to the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (version mismatch, duplicate, wrong status).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
