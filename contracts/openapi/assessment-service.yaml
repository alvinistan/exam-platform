openapi: 3.1.0
info:
  title: assessment-service
  version: 0.1.0
  description: >-
    Attempts for Practice, Mock exam and Adaptive exam: a fixed question set chosen at start, answering with
    immediate or after-submit feedback, server-enforced timing, authoritative scoring, results and review. Routed under /api/attempts and /api/admin/attempts.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin, through the API gateway (local default http://localhost:8080)
tags:
  - name: Attempts
    description: A student's own attempts
  - name: Admin attempts
    description: Read-only attempt views for administrators
  - name: Internal
    description: Service-to-service only
security:
  - bearerAuth: []
paths:
  /api/attempts:
    get:
      tags: [Attempts]
      operationId: listMyAttempts
      summary: My recent attempts (newest first, at most 50)
      parameters:
        - { name: examId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Attempts, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttemptSummary' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
    post:
      tags: [Attempts]
      operationId: startAttempt
      summary: Start an attempt
      description: >-
        Chooses the questions (topics take turns; questions seen in the last 7 days come last), asks subscription-service
        whether the student may start (which counts one free attempt of that exam type), and stores the question set
        with its answer key. Answers are never sent before they may be disclosed. Repeating the call with the same
        Idempotency-Key returns the same attempt (200). A Mock exam lasts the minutes chosen, or for a question count
        the questions' estimated solving times; never longer than the exam's mock time limit.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-generated key (at most 100 characters). Recommended.
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAttemptRequest' }
      responses:
        '201': { description: Attempt started., content: { application/json: { schema: { $ref: '#/components/schemas/AttemptView' } } } }
        '200': { description: The attempt started earlier with the same Idempotency-Key., content: { application/json: { schema: { $ref: '#/components/schemas/AttemptView' } } } }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403':
          description: FREE_ALLOWANCE_USED (free attempts of this exam type used up), SUBSCRIPTION_REQUIRED or MODE_DISABLED.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '404':
          description: EXAM_UNAVAILABLE.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '409':
          description: CONFLICT when a Mock exam on this exam is already in progress; the problem has `attemptId` to resume it.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '422':
          description: INSUFFICIENT_QUESTIONS (no questions for the topics chosen).
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /api/attempts/{attemptId}:
    get:
      tags: [Attempts]
      operationId: getAttempt
      summary: An attempt with its questions, answers so far, and (once finished) the result and full review
      description: >-
        Finishes the attempt first if its time is up. Other students' attempts answer 404. The countdown is drawn from
        expiresAt and serverNow, never from the client's clock.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': { description: Attempt., content: { application/json: { schema: { $ref: '#/components/schemas/AttemptView' } } } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /api/attempts/{attemptId}/answers/{position}:
    put:
      tags: [Attempts]
      operationId: saveAnswer
      summary: Answer, change an answer or flag a question
      description: >-
        With immediate feedback (Practice, Adaptive, and Mock when set up so) the answer is checked and locked, and the
        response includes the review. Otherwise the answer is saved and can be changed until submitting. `selected`
        omitted changes only the flag. Answers more than 5 seconds after a Mock exam's end are refused (ATTEMPT_EXPIRED)
        and the attempt is finished with the answers given in time.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - { name: position, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selected: { type: array, maxItems: 5, items: { type: string, enum: [A, B, C, D, E] }, description: Display letters. }
                flagged: { type: boolean }
                timeSpentMs: { type: integer, minimum: 0, description: Time spent on this question since the last save. }
      responses:
        '200': { description: The question as it now stands., content: { application/json: { schema: { $ref: '#/components/schemas/QuestionView' } } } }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409':
          description: ATTEMPT_EXPIRED, ATTEMPT_FINISHED, or CONFLICT when an answer that was already checked is changed.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
  /api/attempts/{attemptId}/submit:
    post:
      tags: [Attempts]
      operationId: submitAttempt
      summary: Finish and mark the attempt
      description: Idempotent; submitting a finished attempt returns it unchanged. Marked on the server from the stored answer key.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': { description: The finished attempt with its result and review., content: { application/json: { schema: { $ref: '#/components/schemas/AttemptView' } } } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /api/admin/attempts:
    get:
      tags: [Admin attempts]
      operationId: adminListAttempts
      summary: Browse attempts (read-only) — planned, not implemented yet
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
        - { name: studentId, in: query, schema: { type: string, format: uuid } }
        - { name: examId, in: query, schema: { type: string, format: uuid } }
        - { name: mode, in: query, schema: { $ref: './common.yaml#/components/schemas/Mode' } }
      responses:
        '200':
          description: Page of attempts.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AttemptSummary' } }
                  page: { $ref: './common.yaml#/components/schemas/PageMeta' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /internal/events:
    get:
      tags: [Internal]
      operationId: assessmentEventFeed
      summary: Outbox event feed (AttemptStarted, AttemptCompleted) — planned for the adaptive engine (Step B)
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Events in sequence order.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttemptCompletedEvent' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    StartAttemptRequest:
      type: object
      required: [examId, mode, sizeBy]
      properties:
        examId: { type: string, format: uuid }
        mode: { $ref: './common.yaml#/components/schemas/Mode' }
        topicIds: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: Missing or empty means every topic. }
        sizeBy: { type: string, enum: [COUNT, TIME] }
        questionCount: { type: integer, minimum: 1, description: 'For COUNT; at most the exam type''s maximum (default 30).' }
        minutes: { type: integer, minimum: 1, maximum: 180, description: For TIME; a Mock exam at most its time limit. }
    AttemptSummary:
      type: object
      required: [id, examId, examTitle, examSlug, mode, status, startedAt, questionCount]
      properties:
        id: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        examSlug: { type: string }
        mode: { $ref: './common.yaml#/components/schemas/Mode' }
        status: { type: string, enum: [IN_PROGRESS, SCORED] }
        finishReason: { type: [string, 'null'], enum: [SUBMITTED, EXPIRED, ABANDONED, null] }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        questionCount: { type: integer }
        score: { type: [number, 'null'] }
        maxScore: { type: [number, 'null'] }
        percent: { type: [integer, 'null'] }
        correct: { type: [integer, 'null'] }
        incorrect: { type: [integer, 'null'] }
        unanswered: { type: [integer, 'null'] }
    QuestionView:
      type: object
      required: [position, topicId, topicTitle, difficulty, answerType, estSeconds, stemHtml, options, selected, flagged, answered]
      properties:
        position: { type: integer }
        topicId: { type: string, format: uuid }
        topicTitle: { type: string }
        difficulty: { $ref: './common.yaml#/components/schemas/Difficulty' }
        answerType: { type: string, enum: [SINGLE, MULTI] }
        estSeconds: { type: integer }
        stemHtml: { type: string }
        stemMediaUrl: { type: [string, 'null'] }
        stemMediaAlt: { type: [string, 'null'] }
        options:
          type: array
          description: In this attempt's display order, lettered A, B, C … No correctness information.
          items:
            type: object
            required: [label, bodyHtml]
            properties:
              label: { type: string }
              bodyHtml: { type: string }
              mediaUrl: { type: [string, 'null'] }
              mediaAlt: { type: [string, 'null'] }
        selected: { type: array, items: { type: string } }
        flagged: { type: boolean }
        answered: { type: boolean }
        review:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Review'
          description: Present once the answer was checked (immediate feedback) or the attempt is finished.
    Review:
      type: object
      required: [correctLabels, keyPoints, definitions, awarded, marks]
      properties:
        correct: { type: [boolean, 'null'], description: Null when unanswered. }
        correctLabels: { type: array, items: { type: string } }
        explanationHtml: { type: [string, 'null'] }
        keyPoints: { type: array, items: { type: string } }
        definitions:
          type: array
          items:
            type: object
            properties:
              term: { type: string }
              meaning: { type: string }
        awarded: { type: number }
        marks: { type: number }
    AttemptView:
      type: object
      required: [id, examId, examTitle, examSlug, mode, status, feedback, sizeBy, estimatedSeconds, startedAt, serverNow, topics, questions]
      properties:
        id: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        examSlug: { type: string }
        mode: { $ref: './common.yaml#/components/schemas/Mode' }
        status: { type: string, enum: [IN_PROGRESS, SCORED] }
        finishReason: { type: [string, 'null'], enum: [SUBMITTED, EXPIRED, ABANDONED, null] }
        feedback: { type: string, enum: [IMMEDIATE, AFTER_SUBMIT] }
        sizeBy: { type: string, enum: [COUNT, TIME] }
        requestedCount: { type: [integer, 'null'], description: May be more than the questions given when the pool is smaller. }
        requestedMinutes: { type: [integer, 'null'] }
        estimatedSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: Mock exams only. }
        finishedAt: { type: [string, 'null'], format: date-time }
        serverNow: { type: string, format: date-time }
        topics:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
        questions: { type: array, items: { $ref: '#/components/schemas/QuestionView' } }
        result:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AttemptResult'
    AttemptResult:
      type: object
      required: [score, maxScore, percent, correct, incorrect, unanswered, durationSeconds, byTopic]
      properties:
        score: { type: number }
        maxScore: { type: number }
        percent: { type: integer }
        correct: { type: integer }
        incorrect: { type: integer }
        unanswered: { type: integer }
        passMarkPct: { type: [integer, 'null'] }
        passed: { type: [boolean, 'null'], description: Only when the exam type has a pass mark (SC-5). }
        durationSeconds: { type: integer }
        byTopic:
          type: array
          items:
            type: object
            required: [topicId, title, total, correct, incorrect, unanswered, percent]
            properties:
              topicId: { type: string, format: uuid }
              title: { type: string }
              total: { type: integer }
              correct: { type: integer }
              incorrect: { type: integer }
              unanswered: { type: integer }
              percent: { type: integer }
    AttemptCompletedEvent:
      type: object
      required: [seq, id, type, occurredAt, payload]
      properties:
        seq: { type: integer }
        id: { type: string, format: uuid }
        type: { type: string, enum: [AttemptStarted, AttemptCompleted] }
        occurredAt: { type: string, format: date-time }
        payload:
          type: object
          description: For AttemptCompleted, studentId, examId, mode, finishReason and one entry per question (topic, version, difficulty, outcome, selected labels, misconception, time).
