# API gateway. Upstream URLs come from the environment (Docker Compose sets them to the service names).
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: gateway
  servlet:
    multipart:
      # The gateway forwards uploads untouched; the owning service parses and limits them.
      enabled: false
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/users/**,/.well-known/jwks.json
            - id: catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/categories/**,/api/exams/**,/api/admin/catalog/**,/api/media/**
            - id: assessment
              uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/attempts/**,/api/progress/**,/api/admin/attempts/**
            - id: learning
              uri: ${LEARNING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/learning/**,/api/admin/learning/**
            - id: subscription
              uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/access/**,/api/plans/**,/api/subscriptions/**,/api/payments/**,/api/admin/billing/**

gateway:
  # identity-service's public keys; requests with an invalid token stop here (ADR-004).
  jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  # In-memory token buckets (ADR-015). capacity = burst; refill-per-minute = steady rate.
  rate-limits:
    # Starting a Google sign-in. Per address, generous enough for a class signing in together on one connection.
    - name: sign-in
      paths: [/api/auth/google/**]
      key: IP
      capacity: 60
      refill-per-minute: 60
    # Token refresh runs on every page load and every 15 minutes for each open tab (Phase 14: it used to share the
    # sign-in limit, which a class on one connection would exceed). Refresh tokens are long random values, so this
    # only guards against floods.
    - name: token-refresh
      paths: [/api/auth/token, /api/auth/logout]
      methods: [POST]
      key: IP
      capacity: 300
      refill-per-minute: 300
    - name: checkout
      paths: [/api/subscriptions/checkout]
      methods: [POST]
      key: USER
      capacity: 5
      refill-per-minute: 5
    # Trying discount codes: enough for typos, too slow to guess codes.
    - name: price-quote
      paths: [/api/subscriptions/quote]
      methods: [POST]
      key: USER
      capacity: 10
      refill-per-minute: 10
    - name: attempt-start
      paths: [/api/attempts]
      methods: [POST]
      key: USER
      capacity: 20
      refill-per-minute: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name},%X{correlationId:-}] "
