# subscription-service. Every value can be overridden with an environment variable; secrets have no defaults.
server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: subscription-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USERNAME:billing_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Phase 8: catalogue read model and this service's login for internal calls (ADR-005, ADR-006).
subscription:
  catalog-feed:
    enabled: ${CATALOG_FEED_ENABLED:true}
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    interval: ${CATALOG_FEED_INTERVAL:2s}
  service-client:
    token-uri: ${IDENTITY_TOKEN_URI:http://localhost:8081/oauth2/token}
    client-id: subscription-service
    client-secret: ${SUBSCRIPTION_SERVICE_CLIENT_SECRET:}
  # Phase 11 (ADR-011). TEST is a labelled stand-in where no money moves; it is refused under the prod profile.
  payments:
    provider: ${PAYMENT_PROVIDER:TEST}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
    # Phase 14: the prod profile refuses the PayHere sandbox unless this is true (staging sites only).
    allow-sandbox-in-prod: ${PAYMENTS_ALLOW_SANDBOX_IN_PROD:false}
    payhere:
      merchant-id: ${PAYHERE_MERCHANT_ID:}
      merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
      sandbox: ${PAYHERE_SANDBOX:true}
      # Phase 13: PayHere API key (Settings > API Keys) for automatic refunds; empty = refunds are recorded manually.
      app-id: ${PAYHERE_APP_ID:}
      app-secret: ${PAYHERE_APP_SECRET:}

platform:
  security:
    # identity-service's public signing keys; every access token is verified against them (ADR-004).
    jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

logging:
  pattern:
    correlation: "[${spring.application.name},%X{correlationId:-}] "
