# assessment-service. Every value can be overridden with an environment variable; secrets have no defaults.
server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: assessment-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assessment}
    username: ${DB_USERNAME:assessment_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Phase 9: where the question pool and access decisions come from, and this service's login for those calls.
assessment:
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  subscription-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8085}
  service-client:
    token-uri: ${IDENTITY_TOKEN_URI:http://localhost:8081/oauth2/token}
    client-id: assessment-service
    client-secret: ${ASSESSMENT_SERVICE_CLIENT_SECRET:}
  timing:
    grace: ${ATTEMPT_GRACE:5s}
    abandon-after: ${ATTEMPT_ABANDON_AFTER:24h}
    recently-seen: ${QUESTION_REPEAT_AFTER:7d}

platform:
  security:
    # identity-service's public signing keys; every access token is verified against them (ADR-004).
    jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

logging:
  pattern:
    correlation: "[${spring.application.name},%X{correlationId:-}] "
