# identity-service. Every value can be overridden with an environment variable; secrets have no defaults.
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USERNAME:identity_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Phase 5: Google sign-in and platform tokens (ADR-004). Secrets only from the environment.
identity:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
  admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  jwt:
    signing-keys: ${IDENTITY_JWT_SIGNING_KEYS:}
    require-configured-key: ${IDENTITY_REQUIRE_SIGNING_KEY:false}
  # Backend services that may get tokens with the client-credentials grant (ADR-005). A blank secret turns a client
  # off. Scopes name what the token may reach: catalog.internal (catalog event feed), billing.access (decisions).
  service-clients:
    subscription-service:
      secret: ${SUBSCRIPTION_SERVICE_CLIENT_SECRET:}
      scopes: catalog.internal
    assessment-service:
      secret: ${ASSESSMENT_SERVICE_CLIENT_SECRET:}
      scopes: catalog.internal,billing.access
    learning-service:
      secret: ${LEARNING_SERVICE_CLIENT_SECRET:}
      scopes: catalog.internal

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

logging:
  pattern:
    correlation: "[${spring.application.name},%X{correlationId:-}] "
